<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Afrika Topografie Quiz</title>

<style>

body{
    font-family: Arial, sans-serif;
    text-align:center;
    background:#f5f5f5;
}

h1{
    margin-top:20px;
}

#frage{
    font-size:32px;
    font-weight:bold;
    margin:20px;
}

#meldung{
    font-size:28px;
    height:40px;
    margin:15px;
}

#kategorieButtons{
    position:fixed;
    top:14px;
    right:18px;
    display:flex;
    justify-content:flex-end;
    gap:8px;
    margin:0;
    z-index:1000;
}

#kategorieButtons button{
    padding:9px 16px;
    border:1px solid #999;
    border-radius:8px;
    background:white;
    font-weight:bold;
    cursor:pointer;
}

#kategorieButtons button.aktiv{
    color:white;
    border-color:#1769aa;
    background:#1769aa;
}

@media (max-width: 600px){
    #kategorieButtons{
        top:8px;
        right:8px;
        gap:4px;
    }

    #kategorieButtons button{
        padding:7px 9px;
        font-size:12px;
    }
}

#cursorDot{
    position:fixed;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#00aaff;
    border:2px solid white;
    box-shadow:0 0 12px #00aaff;

    pointer-events:none;

    z-index:99999;

    transform:translate(-50%, -50%);
}

.abdruck{
    position:fixed;
    width:20px;
    height:20px;
    border-radius:50%;

    pointer-events:none;

    transform:translate(-50%, -50%);

    z-index:9999;
}

.richtig{
    background:rgba(0,255,0,0.25);
    border:3px solid green;
}

.falsch{
    background:rgba(255,0,0,0.25);
    border:3px solid red;
}

.richtigerPunkt{
    position:fixed;
    width:16px;
    height:16px;
    border:2px solid white;
    border-radius:50%;
    background:red;
    box-shadow:0 0 10px red;
    pointer-events:none;
    z-index:100000;
    transform:translate(-50%, -50%);
}

body{
    margin:0;
    overflow:hidden;
    font-family:Arial,sans-serif;
    text-align:center;
    background:#f5f5f5;
}

#quizContainer{
    display:flex;
    justify-content:center;
    align-items:flex-start;
    gap:25px;
    margin-top:20px;
}

#map{
    width:650px;      /* kleineres Bild */
    height:auto;
    border:2px solid black;
    cursor:none;

    user-select:none;
    -webkit-user-drag:none;
    -webkit-user-select:none;
}

#checkliste{
    width:320px;
    height:700px;
    overflow-y:auto;

    background:white;
    padding:15px;

    text-align:left;

    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,0.15);
}

#checkliste li{
    margin:5px 0;
    list-style:none;
}

</style>
</head>

<body>

<h1>Afrika Topografie Quiz</h1>

<nav id="kategorieButtons" aria-label="Quizkategorie auswählen">
    <button type="button" class="aktiv" data-kategorie="Topografie">Topografie</button>
    <button type="button" data-kategorie="Laender">Länder</button>
    <button type="button" data-kategorie="Staedte">Städte</button>
</nav>

<div id="frage">Lädt...</div>

<div id="quizContainer">

    <img
        id="map"
        src="afrika.png"
        alt="Afrika Karte"
        draggable="false"
        onclick="karteKlick(event)"
    >

    <ul id="checkliste"></ul>

</div>

<div id="meldung"></div>

<h2>
Punkte:
<span id="punkte">0</span>
</h2>

<div id="cursorDot"></div>

<script src="quiz.js"></script>

</body>
</html>
